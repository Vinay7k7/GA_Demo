name: 09-functions
# In this we will use the functions in the workflow 
on:
    pull_request:
    workflow_dispatch:
jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: I will fail no matter what
              run: exit 1
            - name: I will be skipped 
              if: ${{ success() }}
              run: echo "I will print if the previous step succeed"
            - name: I will be excecute 
              if: ${{ failed()}}
              run: echo "I will be print if any revious step fails"
            - name: I will be excecute 
              if: ${{ !cancelled()}}
              run: echo "I will always print except if the workflow is cancelled "
            - name: I will excecute when cancelled
              if: ${{ cancelled()}}
              run: echo "this will execute when the workflow get cancelled "
    